    const input = wrapper.querySelector('input');
    const dropdown = wrapper.querySelector('.suggest-dropdown');

    const allPandas = getAllPandaOptions().filter(o => o.name !== '野外');

    if (initialValue) {
      const matched = allPandas.find(p => p.display === initialValue);
      if (matched) {
        input.dataset.selectedId = matched.id;
      }
    }

    function renderDropdown(list) {
      if (!list || list.length === 0) {
        dropdown.innerHTML = `<div class="no-match">未找到匹配的熊猫</div>`;
        dropdown.classList.add('show');
        return;
      }
      dropdown.innerHTML = list.map(item =>
        `<div class="suggest-item" data-value="${item.display}">🐼 ${item.display}</div>`
      ).join('');
      dropdown.classList.add('show');
      dropdown.querySelectorAll('.suggest-item').forEach(el => {
        el.addEventListener('click', function() {
          const display = this.dataset.value;
          input.value = display;
          const matched = allPandas.find(p => p.display === display);
          if (matched) input.dataset.selectedId = matched.id;
          dropdown.classList.remove('show');
          input.dispatchEvent(new Event('input'));
        });
      });
    }

    input.addEventListener('focus', function() {
      const val = this.value.trim();
      if (val && val !== '野外') {
        const kw = val.toLowerCase();
        const filtered = allPandas.filter(p => p.display.toLowerCase().includes(kw));
        renderDropdown(filtered);
      } else if (val === '野外') {
        dropdown.classList.remove('show');
      } else {
        renderDropdown(allPandas.slice(0, 10));
      }
    });

    input.addEventListener('input', function() {
      const val = this.value.trim();
      if (!val) {
        this.dataset.selectedId = '';
        dropdown.classList.remove('show');
        input.dispatchEvent(new Event('input'));
        return;
      }
      if (val === '野外') {
        this.dataset.selectedId = '';
        dropdown.classList.remove('show');
        input.dispatchEvent(new Event('input'));
        return;
      }
      const kw = val.toLowerCase();
      const filtered = allPandas.filter(p => p.display.toLowerCase().includes(kw));
      renderDropdown(filtered);
    });

    input.addEventListener('blur', function() {
      setTimeout(() => dropdown.classList.remove('show'), 200);
    });

    document.addEventListener('click', function(e) {
      if (!wrapper.contains(e.target)) dropdown.classList.remove('show');
    });

    if (initialValue === '野外') {
      input.dataset.isWild = 'true';
    }

    return input;
  }

    const locVal = p.location || '';
    const passingVal = p.passingDate || '';
    const pedigreeVal = p.pedigree || '';
    const showPassing = !isNew && (p.location && p.location.trim() === '潘达星');
    const isComplete = p.isComplete || false;
    const hasSeen = p.hasSeen || false;
    const events = p.lifeEvents || [];
    const photoVal = p.photo || '';

    let motherDisplay = '';
    let motherId = p.motherId || '';
    if (motherId) {
      const m = getPandaById(motherId);
      if (m) motherDisplay = getDisplayName(m);
    }
    if (!motherDisplay && p.mother && !isWild(p.mother)) {
      motherDisplay = p.mother;
    }
    if (p.mother && isWild(p.mother)) {
      motherDisplay = '野外';
    }

    let fatherDisplay = '';
    let fatherId = p.fatherId || '';
    if (fatherId) {
      const f = getPandaById(fatherId);
      if (f) fatherDisplay = getDisplayName(f);
    }
    if (!fatherDisplay && p.father && !isWild(p.father)) {
      fatherDisplay = p.father;
    }
    if (p.father && isWild(p.father)) {
      fatherDisplay = '野外';
    }

    let eventsHtml = '';
    if (events.length > 0) {
      const sorted = [...events].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      sorted.forEach((e, idx) => {
        const dateDisplay = e.date || '未知日期';
        eventsHtml += `
          <div class="event-row">
            <span class="event-date">${dateDisplay}</span>
            <span class="event-text">${e.event}</span>
            <button class="del-event-btn" data-index="${idx}" title="删除">×</button>
          </div>
        `;
      });
    } else {
      eventsHtml = `<div class="empty-events-edit">暂无记录</div>`;
    }

    const previewImg = photoVal ? `<img src="${photoVal}" alt="预览" />` : '';
    const previewClass = photoVal ? 'has-image' : '';

    let html = `
      <div class="edit-form">
        <div class="edit-avatar-preview">
          <div class="avatar-preview-box ${previewClass}" id="editAvatarPreview">
            ${previewImg || '🐼'}
          </div>
          <div class="avatar-actions">
            <button class="btn btn-outline btn-sm" id="editUploadPhotoBtn"><i class="fas fa-camera"></i> 上传照片</button>
            ${photoVal ? `<button class="btn btn-danger btn-sm" id="editRemovePhotoBtn"><i class="fas fa-times"></i> 移除</button>` : ''}
            <span style="font-size:0.7rem;color:#8a9a86;">点击头像也可上传</span>
          </div>
        </div>

        <div class="form-row">
          <label>名字 <span class="required">*</span></label>
          <input type="text" id="editName" value="${nameVal}" placeholder="如：花花" />
        </div>
        <div class="form-row">
          <label>别名</label>
          <input type="text" id="editAlias" value="${aliasVal}" placeholder="请输入熊猫的别名" />
        </div>
        <div class="form-row">
          <label>性别</label>
          <select id="editGender">
            <option value="雌性" ${genderVal==='雌性'?'selected':''}>雌性</option>
            <option value="雄性" ${genderVal==='雄性'?'selected':''}>雄性</option>
            <option value="未知" ${genderVal==='未知'?'selected':''}>未知</option>
          </select>
        </div>
        <div class="form-row">
          <label>生日</label>
          <input type="text" id="editBirthday" value="${birthdayVal}" placeholder="YYYY-MM-DD / YYYY-MM / YYYY" />
        </div>
        <div class="form-row">
          <label>谱系号</label>
          <input type="text" id="editPedigree" value="${pedigreeVal}" placeholder="如：1234" />
        </div>
        <div class="form-row">
          <label>机构</label>
          <div id="editOrgContainer" style="flex:1;min-width:100px;"></div>
        </div>
        <div class="form-row">
          <label>所在地</label>
          <div id="editLocContainer" style="flex:1;min-width:100px;"></div>
        </div>
    `;

    html += `
        <div class="form-row" id="editPassingRow" style="display:${showPassing ? 'flex' : 'none'};">
          <label>离世</label>
          <input type="date" id="editPassing" value="${passingVal}" />
        </div>
    `;

    html += `
        <div class="form-row">
          <label>母亲</label>
          <div id="editMotherContainer" style="flex:1;min-width:100px;"></div>
        </div>
        <div class="form-row">
          <label>父亲</label>
          <div id="editFatherContainer" style="flex:1;min-width:100px;"></div>
        </div>

        <div class="complete-toggle-row" style="justify-content: space-between;">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="toggle-label">信息已完善</span>
            <div class="toggle-switch ${isComplete ? 'active' : ''}" id="completeToggle">
              <div class="toggle-knob"></div>
            </div>
            <span class="toggle-status-text ${isComplete ? 'complete' : 'incomplete'}" id="completeStatusText">
              ${isComplete ? '✅ 已完善' : '🟡 待补充'}
            </span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="toggle-label">👀 见过</span>
            <div class="toggle-switch ${hasSeen ? 'active' : ''}" id="seenToggleEdit">
              <div class="toggle-knob"></div>
            </div>
            <span class="toggle-status-text ${hasSeen ? 'complete' : 'incomplete'}" id="seenStatusTextEdit">
              ${hasSeen ? '✅ 已见过' : '⬜ 未见过'}
            </span>
          </div>
        </div>

        <div class="life-events-edit">
          <div class="events-title">📜 熊生大事</div>
          <div id="eventsListContainer">
            ${eventsHtml}
          </div>
          <div class="add-event-row">
            <input type="date" id="newEventDate" />
            <input type="text" id="newEventText" placeholder="输入大事内容..." />
            <button class="add-event-btn" id="addEventBtn">+ 添加</button>
          </div>
        </div>
      </div>
      <div class="edit-actions">
        <button class="btn btn-outline" id="editCancelBtn"><i class="fas fa-times"></i> 取消</button>
        <button class="btn btn-success" id="editSaveBtn"><i class="fas fa-save"></i> 保存</button>
      </div>
    `;

    editBody.innerHTML = html;

    const orgInput = createSuggestInput('editOrgContainer', orgOptions, 'editOrg', orgVal, '输入或选择机构');
    const locInput = createSuggestInput('editLocContainer', locOptions, 'editLoc', locVal, '输入或选择所在地');

    const allPandaNames = getAllPandaOptions().map(o => o.display).filter(n => n !== '野外');

    const motherInput = createSuggestInputWithWildcard('editMotherContainer', allPandaNames, 'editMother', motherDisplay, '输入搜索母亲...');
    const fatherInput = createSuggestInputWithWildcard('editFatherContainer', allPandaNames, 'editFather', fatherDisplay, '输入搜索父亲...');

    const avatarPreview = document.getElementById('editAvatarPreview');
    const uploadBtn = document.getElementById('editUploadPhotoBtn');
    const removeBtn = document.getElementById('editRemovePhotoBtn');

    function updatePhotoPreview(dataUrl) {
      if (dataUrl) {
        avatarPreview.innerHTML = `<img src="${dataUrl}" alt="预览" />`;
        avatarPreview.className = 'avatar-preview-box has-image';
        if (!removeBtn) {
          const actions = document.querySelector('.edit-avatar-preview .avatar-actions');
          const newRemoveBtn = document.createElement('button');
          newRemoveBtn.className = 'btn btn-danger btn-sm';
          newRemoveBtn.id = 'editRemovePhotoBtn';
          newRemoveBtn.innerHTML = '<i class="fas fa-times"></i> 移除';
          newRemoveBtn.addEventListener('click', function() {
            p.photo = '';
            updatePhotoPreview('');
            saveData();
          });
          actions.appendChild(newRemoveBtn);
        } else {
          removeBtn.style.display = 'inline-flex';
        }
      } else {
        avatarPreview.innerHTML = '🐼';
        avatarPreview.className = 'avatar-preview-box';
        if (removeBtn) removeBtn.style.display = 'none';
      }
    }

    function handlePhotoUpload(file) {
        compressImage(file, 600, 0.85).then(dataUrl => {
          p.photo = dataUrl;
          updatePhotoPreview(url);
          saveData();
        }).catch(err => {
          alert('图片处理失败：' + err.message);
        });
    }

    avatarPreview.addEventListener('click', function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function(e) {
        if (e.target.files.length) {
          handlePhotoUpload(e.target.files[0]);
        }
      };
      input.click();
    });

    uploadBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = function(e) {
        if (e.target.files.length) {
          handlePhotoUpload(e.target.files[0]);
        }
      };
      input.click();
    });

    if (removeBtn) {
      removeBtn.addEventListener('click', function() {
        p.photo = '';
        updatePhotoPreview('');
        saveData();
      });
    }

    const addEventBtn = document.getElementById('addEventBtn');
    const newEventDate = document.getElementById('newEventDate');
    const newEventText = document.getElementById('newEventText');
    const eventsListContainer = document.getElementById('eventsListContainer');
    let currentEvents = [...events];

    if (newEventDate) {
      const today = new Date().toISOString().slice(0, 10);
      newEventDate.value = today;
    }

    function renderEventList() {
      if (currentEvents.length === 0) {
        eventsListContainer.innerHTML = '<div class="empty-events-edit">暂无记录</div>';
        return;
      }
      const sorted = [...currentEvents].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      let html2 = '';
      sorted.forEach((e, idx) => {
        const dateDisplay = e.date || '未知日期';
        html2 += `
          <div class="event-row">
            <span class="event-date">${dateDisplay}</span>
            <span class="event-text">${e.event}</span>
            <button class="del-event-btn" data-index="${idx}" title="删除">×</button>
          </div>
        `;
      });
      eventsListContainer.innerHTML = html2;
      eventsListContainer.querySelectorAll('.del-event-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const idx = parseInt(this.dataset.index);
          currentEvents.splice(idx, 1);
          renderEventList();
        });
      });
    }

    addEventBtn.addEventListener('click', function() {
      const date = newEventDate.value.trim();
      const text = newEventText.value.trim();
      if (!text) {
        alert('请填写大事内容');
        return;
      }
      if (!date) {
        alert('请选择日期');
        return;
      }
      currentEvents.push({ date, event: text });
      newEventText.value = '';
      renderEventList();
    });

    newEventText.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addEventBtn.click();
      }
    });

    eventsListContainer.querySelectorAll('.del-event-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const idx = parseInt(this.dataset.index);
        currentEvents.splice(idx, 1);
        renderEventList();
      });
    });

    const toggle = document.getElementById('completeToggle');
    const statusText = document.getElementById('completeStatusText');
    let currentComplete = isComplete;

    toggle.addEventListener('click', function() {
      currentComplete = !currentComplete;
      this.classList.toggle('active', currentComplete);
      if (currentComplete) {
        statusText.textContent = '✅ 已完善';
        statusText.className = 'toggle-status-text complete';
      } else {
        statusText.textContent = '🟡 待补充';
        statusText.className = 'toggle-status-text incomplete';
      }
    });

    const seenToggleEdit = document.getElementById('seenToggleEdit');
    const seenStatusTextEdit = document.getElementById('seenStatusTextEdit');
    let currentSeen = hasSeen;

    seenToggleEdit.addEventListener('click', function() {
      currentSeen = !currentSeen;
      this.classList.toggle('active', currentSeen);
      if (currentSeen) {
        seenStatusTextEdit.textContent = '✅ 已见过';
        seenStatusTextEdit.className = 'seen-status-text seen';
      } else {
        seenStatusTextEdit.textContent = '⬜ 未见过';
        seenStatusTextEdit.className = 'seen-status-text not-seen';
      }
    });

    const passingRow = document.getElementById('editPassingRow');
    locInput.addEventListener('input', function() {
      if (passingRow) {
        passingRow.style.display = (this.value.trim() === '潘达星') ? 'flex' : 'none';
      }
    });

    document.getElementById('editCancelBtn').addEventListener('click', function() {
      if (isNew) {
        detailHistory = [];
        showPage('pageHome');
      } else {
        openDetail(p.id);
      }
    });

    document.getElementById('editSaveBtn').addEventListener('click', function() {
      p.lifeEvents = currentEvents;
      const motherVal = motherInput.value.trim();
      const fatherVal = fatherInput.value.trim();
      const motherId = motherInput.dataset.selectedId || '';
      const fatherId = fatherInput.dataset.selectedId || '';
      const isMotherWild = motherVal === '野外';
      const isFatherWild = fatherVal === '野外';

      if (motherVal && !isMotherWild && !motherId) {
        alert('母亲 "' + motherVal + '" 未匹配到任何熊猫，请先录入该熊猫或清空此字段');
        return;
      }
      if (fatherVal && !isFatherWild && !fatherId) {
        alert('父亲 "' + fatherVal + '" 未匹配到任何熊猫，请先录入该熊猫或清空此字段');
        return;
      }

      const motherName = isMotherWild ? '野外' : (motherId ? (getPandaById(motherId)?.name || motherVal) : motherVal);
      const fatherName = isFatherWild ? '野外' : (fatherId ? (getPandaById(fatherId)?.name || fatherVal) : fatherVal);

      handleEditSave(p, isNew, orgInput, locInput, motherId, fatherId, motherName, fatherName, currentComplete, currentSeen);
    });
  }

  function handleEditSave(p, isNew, orgInput, locInput, motherId, fatherId, motherName, fatherName, isComplete, hasSeen) {
    // 编辑保存时才要求输入密码
    if (CLOUD_ENABLED && !sessionStorage.getItem('panda_write_token')) {
      const token = prompt('请输入编辑密码（用于同步到云端）：');
      if (!token) { setStatus('💾 已取消保存'); return; }
      sessionStorage.setItem('panda_write_token', token);
    }
    const name = document.getElementById('editName').value.trim();
    if (!name) { alert('请填写熊猫名字'); return; }
    const alias = document.getElementById('editAlias').value.trim();

    const existing = pandas.find(item => {
      if (isNew && item.id === 'temp_new') return false;
      if (!isNew && item.id === p.id) return false;
      const itemAlias = (item.alias || '').trim().toLowerCase();
      const inputAlias = (alias || '').trim().toLowerCase();
      return item.name.trim().toLowerCase() === name.toLowerCase() &&
             itemAlias === inputAlias;
    });
    if (existing) {
      const displayName = name + (alias ? '（' + alias + '）' : '');
      alert('"' + displayName + '" 已存在，请使用不同的名字或别名');
      return;
    }

    const gender = document.getElementById('editGender').value;
    const birthday = document.getElementById('editBirthday').value.trim();
    const pedigree = document.getElementById('editPedigree').value.trim();
    const org = orgInput ? orgInput.value.trim() : '';
    const location = locInput ? locInput.value.trim() : '';
    const passingInput = document.getElementById('editPassing');
    const passingDate = passingInput ? passingInput.value : '';

    if (motherId === p.id) {
      alert('不能选择自己作为母亲');
      return;
    }
    if (fatherId === p.id) {
      alert('不能选择自己作为父亲');
      return;
    }

    const lifeEvents = p.lifeEvents || [];
    const photo = p.photo || '';

    if (isNew) {
      const newPanda = {
        id: 'p' + (nextId++),
        name,
        alias,
        gender,
        birthday,
        org,
        location,
        mother: motherName,
        father: fatherName,
        motherId: motherId,
        fatherId: fatherId,
        pedigree,
        passingDate: passingDate || '',
        isComplete: isComplete || false,
        hasSeen: hasSeen || false,
        lifeEvents: lifeEvents,
        photo: photo
      };
      pandas.push(newPanda);
      saveData();
      alert('新增 "' + name + (alias ? '（' + alias + '）' : '') + '" 成功');
      detailHistory = [];
      collapseState = {};
      showPage('pageHome');
      renderBrowse();
      doSearch();
    } else {
      p.name = name;
      p.alias = alias;
      p.gender = gender;
      p.birthday = birthday;
      p.pedigree = pedigree;
      p.org = org;
      p.location = location;
      p.mother = motherName;
      p.father = fatherName;
      p.motherId = motherId;
      p.fatherId = fatherId;
      p.isComplete = isComplete || false;
      p.hasSeen = hasSeen || false;
      p.lifeEvents = lifeEvents;
      p.photo = photo;
      if (passingDate !== undefined) p.passingDate = passingDate;
      saveData();
      alert('已更新 "' + name + (alias ? '（' + alias + '）' : '') + '" 的信息');
      collapseState = {};
      renderDetail(p);
      showPage('pageDetail');
      renderBrowse();
      doSearch();
    }
  }

  function addNewPanda() {
    const tempPanda = { id: 'temp_new', name: '', alias: '', gender: '雌性', birthday: '', org: '', location: '', mother: '', father: '', motherId: '', fatherId: '', passingDate: '', pedigree: '', isComplete: false, hasSeen: false, lifeEvents: [], photo: '' };
    editPandaId = 'temp_new';
    editTitle.textContent = '📝 录入新熊猫';
    renderEditForm(tempPanda, true);
    showPage('pageEdit');
    window.scrollTo(0, 0);
  }

  // ================================================================
  // 事件绑定
  // ================================================================
  homeTitle.addEventListener('click', function() {
    detailHistory = [];
    collapseState = {};
    showPage('pageHome');
    renderBrowse();
  });

  searchBtn.addEventListener('click', doSearch);
  searchInput.addEventListener('keyup', function(e) {
    if (e.key === 'Enter') { doSearch(); return; }
    updateSuggestions(e.target.value);
    // 实时联动筛选体系
    renderBrowse();
  });
  searchInput.addEventListener('blur', function() { setTimeout(() => searchSuggestions.classList.remove('show'), 200); });
  searchInput.addEventListener('focus', function() { if (this.value) updateSuggestions(this.value); });

  addNewBtn.addEventListener('click', addNewPanda);

  // 筛选栏折叠/展开
  const filterToolbar = document.querySelector('.filter-toolbar');
  const filterToggleBtn = document.getElementById('filterToggleBtn');
  if (filterToggleBtn && filterToolbar) {
    filterToggleBtn.addEventListener('click', function() {
      filterToolbar.classList.toggle('show');
      this.classList.toggle('open');
    });
  }

  // ===== 多条件筛选事件绑定 =====

  // 状态类筛选按钮（多选叠加）
  document.querySelectorAll('.filter-group .btn[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.filter;
      toggleStatusFilter(key, btn);
    });
  });

  // 年龄筛选按钮（单选）
  document.getElementById('ageFilterGroup').querySelectorAll('[data-age]').forEach(btn => {
    btn.addEventListener('click', () => setAgeRange(btn.dataset.age));
  });

  // 性别筛选按钮（单选）
  document.getElementById('genderFilterGroup').querySelectorAll('[data-gender]').forEach(btn => {
    btn.addEventListener('click', () => setGenderFilter(btn.dataset.gender));
  });

  editBackBtn.addEventListener('click', function() {
    if (editPandaId === 'temp_new') {
      detailHistory = [];
      collapseState = {};
      showPage('pageHome');
    } else if (editPandaId) {
      openDetail(editPandaId);
    } else {
      showPage('pageHome');
    }
  });

  relationBackBtn.addEventListener('click', function() {
    if (currentPandaId) {
      openDetail(currentPandaId);
    } else {
      showPage('pageHome');
    }
  });

  // ================================================================
  // 初始化
  // ================================================================
  bootstrap();
})();
</script>
</body>
</html>
