<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover" />
  <title>🐼熊猫档案🐼</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ========== CSS 变量体系（活泼可爱风） ========== */
    :root {
      --primary: #3a5a3a;
      --primary-light: #5f825c;
      --primary-gradient: linear-gradient(135deg, #5f825c 0%, #3a5a3a 100%);
      --accent: #e8a030;
      --accent-gradient: linear-gradient(135deg, #f5c26b 0%, #e8a030 100%);
      --bg: #faf7f2;
      --surface: #ffffff;
      --surface-warm: #fdf9f3;
      --border: #e8ddd0;
      --text: #2d3a2b;
      --text-muted: #6b7a66;
      --shadow-sm: 0 2px 8px rgba(58,90,58,0.06);
      --shadow-md: 0 4px 16px rgba(58,90,58,0.08);
      --shadow-lg: 0 12px 32px rgba(58,90,58,0.12);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 28px;
      --radius-xl: 36px;
      --pink-tag-bg: #fce4ec;
      --pink-tag-fg: #c2185b;
      --blue-tag-bg: #e3f2fd;
      --blue-tag-fg: #1565c0;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif; margin: 0; padding: 0; }
    body {
      background: linear-gradient(160deg, #f5f0e6 0%, #e8efe5 50%, #f0f5ea 100%);
      background-attachment: fixed;
      padding: 16px; min-height: 100vh; display: flex; justify-content: center;
    }
    #app {
      max-width: 1060px; width: 100%; background: var(--surface); border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg), 0 2px 6px rgba(0,0,0,0.04); padding: 24px 24px 28px;
      position: relative; min-height: 80vh;
      border: 1px solid rgba(58,90,58,0.06);
    }
    .page-container { position: relative; overflow: hidden; }
    .page-view { display: none; animation: fadeSlideIn 0.28s ease-out; }
    .page-view.active { display: block; }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== 导航标签 ===== */
    .nav-tabs {
      display: flex; align-items: center; gap: 8px; margin-bottom: 18px;
      padding: 4px 4px 14px; position: relative;
    }
    .nav-tabs::after {
      content: ''; position: absolute; bottom: 6px; left: 4px; right: 4px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 15%, var(--border) 85%, transparent);
    }
    .nav-tab {
      padding: 10px 22px; border-radius: var(--radius-lg); font-weight: 600; color: var(--text-muted);
      background: var(--surface-warm); cursor: pointer; transition: all 0.2s ease;
      font-size: 0.95rem; display: flex; align-items: center; gap: 8px; user-select: none;
      border: 1px solid transparent;
    }
    .nav-tab i { font-size: 1rem; }
    .nav-tab.active {
      background: var(--primary-gradient); color: white;
      box-shadow: 0 4px 12px rgba(58,90,58,0.3);
      border-color: transparent;
    }
    .nav-tab:hover:not(.active) { background: var(--bg); color: var(--primary); }
    .nav-tab.home-tab { cursor: pointer; }

    .storage-status {
      font-size: 0.75rem; color: var(--primary); background: linear-gradient(135deg, #e8f0e4, #d6e5cf);
      padding: 6px 16px; border-radius: var(--radius-lg); display: inline-flex; align-items: center;
      margin-left: auto; line-height: 1; font-weight: 500;
      border: 1px solid rgba(95,130,92,0.15);
    }

    /* ===== 通用按钮 ===== */
    .browse-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 4px 0 14px;
    }
    .browse-toolbar .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn {
      background: var(--surface-warm); border: 1px solid var(--border);
      padding: 9px 18px; border-radius: var(--radius-lg);
      font-weight: 500; font-size: 0.9rem; display: inline-flex; align-items: center;
      gap: 8px; cursor: pointer; transition: all 0.2s ease; color: var(--text);
    }
    .btn i { font-size: 1rem; }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn-success { background: linear-gradient(135deg, #4a8c6a, #2d6b4c); color: white; border-color: transparent; }
    .btn-success:hover { box-shadow: 0 4px 14px rgba(45,107,76,0.35); }
    .btn-warning { background: linear-gradient(135deg, #d4a070, #b78a5c); color: white; border-color: transparent; }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); }
    .btn-outline:hover { background: var(--bg); color: var(--text); }
    .btn-primary { background: var(--primary-gradient); color: white; border-color: transparent; }
    .btn-primary:hover { box-shadow: 0 4px 14px rgba(58,90,58,0.35); }
    .btn-danger { background: linear-gradient(135deg, #d94848, #b33c3c); color: white; border-color: transparent; }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
    .btn-group .btn.active-mode { background: var(--primary-gradient); color: white; border-color: transparent; }
    .btn-group .btn.filter-active { background: var(--primary-light); color: white; border-color: transparent; }
    .btn-group .btn.filter-active:hover { background: var(--primary); }

    /* ===== 搜索框 ===== */
    .search-box {
      display: flex; background: var(--surface-warm); border-radius: var(--radius-xl);
      padding: 4px 4px 4px 18px; border: 1.5px solid var(--border);
      width: 100%; max-width: 480px; position: relative; align-items: center;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .search-box:focus-within { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(95,130,92,0.12); }
    .search-box i { align-self: center; color: var(--text-muted); }
    .search-box input {
      border: none; background: transparent; padding: 10px 8px; font-size: 0.95rem;
      width: 100%; outline: none; color: var(--text);
    }
    .search-box input::placeholder { color: #b5c0b0; }
    .search-box button {
      background: var(--primary-gradient); border: none; color: white; padding: 8px 22px;
      border-radius: var(--radius-xl); font-weight: 500; cursor: pointer;
      white-space: nowrap; display: flex; align-items: center; gap: 6px;
      transition: box-shadow 0.2s;
    }
    .search-box button:hover { box-shadow: 0 4px 12px rgba(58,90,58,0.3); }
    .search-suggestions {
      position: absolute; top: 100%; left: 0; right: 0; background: white;
      border: 1px solid var(--border); border-radius: var(--radius-md); margin-top: 6px;
      max-height: 220px; overflow-y: auto; z-index: 100;
      box-shadow: var(--shadow-md); display: none;
    }
    .search-suggestions.show { display: block; }
    .search-suggestions .suggestion-item {
      padding: 10px 20px; cursor: pointer; border-bottom: 1px solid #f5f0e8;
      display: flex; align-items: center; gap: 10px; transition: background 0.15s;
    }
    .search-suggestions .suggestion-item:hover { background: var(--bg); }
    .search-suggestions .suggestion-item:last-child { border-bottom: none; }
    .search-suggestions .suggestion-item .s-name { font-weight: 500; }
    .search-suggestions .suggestion-item .s-sub { font-size: 0.8rem; color: var(--text-muted); }

    /* ===== 统计行 ===== */
    .stats-row {
      display: flex; flex-wrap: wrap; gap: 10px 22px;
      background: linear-gradient(135deg, #fdf9f3, #f5f9f2);
      border-radius: var(--radius-lg); padding: 14px 22px; margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .stats-row .stat-item {
      display: flex; align-items: baseline; gap: 5px; font-size: 0.9rem; color: var(--text);
    }
    .stats-row .stat-item .num {
      font-weight: 700; font-size: 1.15rem; color: var(--primary);
      min-width: 1.4em; text-align: center;
    }
    .stats-row .stat-item .label { color: var(--text-muted); font-weight: 500; }

    /* ===== 筛选工具栏（默认折叠） ===== */
    .filter-toolbar {
      display: flex; flex-wrap: wrap; align-items: center;
      gap: 12px 20px; padding: 0;
      max-height: 0; overflow: hidden;
      border-bottom: none; margin-bottom: 0;
      opacity: 0; transition: all 0.3s ease;
    }
    .filter-toolbar.show {
      max-height: 300px; padding: 12px 0;
      border-bottom: 1px solid var(--border); margin-bottom: 14px; opacity: 1;
    }
    .filter-toggle-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface-warm); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 6px 14px; cursor: pointer;
      font-size: 0.82rem; color: var(--text-muted); font-weight: 500;
      transition: all 0.2s; margin-left: 6px;
    }
    .filter-toggle-btn:hover { background: var(--bg); color: var(--primary); }
    .filter-toggle-btn i.trans { transition: transform 0.25s; }
    .filter-toggle-btn.open i.trans { transform: rotate(180deg); }
    .filter-group {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      background: var(--surface-warm); border-radius: var(--radius-md);
      padding: 8px 14px; border: 1px solid rgba(232,221,208,0.5);
    }
    .filter-group .label { font-size: 0.82rem; color: var(--text-muted); font-weight: 500; margin-right: 2px; }
    .filter-group .btn {
      font-size: 0.8rem; padding: 5px 14px; border-radius: var(--radius-lg);
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; transition: all 0.18s; line-height: 1.4;
    }
    .filter-group .btn:hover { background: #eae4d8; color: var(--text); }
    .filter-group .btn.active {
      background: var(--primary-gradient); color: white; border-color: transparent;
      box-shadow: 0 2px 6px rgba(58,90,58,0.25);
    }
    .filter-group .btn i { margin-right: 4px; }

    /* ===== 分组标题 + 卡片列表 ===== */
    .org-section {
      margin-bottom: 20px; padding: 14px 14px 14px;
      background: var(--surface-warm); border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .org-title {
      font-weight: 700; color: var(--primary); font-size: 1.05rem; margin-bottom: 12px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      cursor: pointer; user-select: none;
      padding: 6px 10px; border-radius: var(--radius-md);
      transition: background 0.2s;
    }
    .org-title:hover { background: rgba(95,130,92,0.08); }
    .org-title .toggle-icon {
      font-size: 0.78rem; color: var(--text-muted);
      transition: transform 0.25s ease; display: inline-block; margin-left: auto;
    }
    .org-title .toggle-icon.collapsed { transform: rotate(-90deg); }
    .org-title i { color: var(--primary-light); }
    .org-title .count-badge {
      font-size: 0.78rem; font-weight: 500; color: var(--primary);
      background: rgba(95,130,92,0.12); padding: 2px 12px; border-radius: var(--radius-lg);
    }
    .org-title .passing-date {
      font-size: 0.8rem; font-weight: 500; color: #9c7a5c;
      background: #f5e8d6; padding: 3px 14px; border-radius: var(--radius-lg);
    }

    .panda-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 10px; overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.25s ease;
      max-height: 3000px; opacity: 1;
      margin-top: 0;
    }
    .panda-list.collapsed { max-height: 0; opacity: 0; margin-top: 0; pointer-events: none; }

    .panda-link {
      cursor: pointer; color: var(--text);
      background: var(--surface); padding: 8px 12px;
      border-radius: var(--radius-md); font-weight: 500;
      border: 1.5px solid var(--border);
      transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
      font-size: 0.9rem; display: flex; flex-direction: row;
      align-items: center; gap: 6px; min-height: 44px;
      box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
    }
    .panda-link:hover {
      background: var(--surface); border-color: var(--primary-light);
      box-shadow: var(--shadow-md); transform: translateY(-2px);
    }
    .panda-link .status-dot {
      position: absolute; top: 6px; right: 8px;
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; box-shadow: 0 0 0 2px rgba(255,255,255,0.8);
    }
    .panda-link .status-dot.complete { background: #2d8a4e; }
    .panda-link .status-dot.incomplete { background: #e8a030; }
    .panda-link .seen-icon {
      font-size: 0.75rem; color: #e8a030; flex-shrink: 0;
    }
    .panda-link .gender-tag {
      font-size: 0.62rem; font-weight: 600; padding: 1px 8px;
      border-radius: var(--radius-lg); background: #ebe5d8; color: #5a5248;
      flex-shrink: 0; margin-left: auto;
    }
    .panda-link .gender-tag.female { background: var(--pink-tag-bg); color: var(--pink-tag-fg); }
    .panda-link .gender-tag.male { background: var(--blue-tag-bg); color: var(--blue-tag-fg); }
    .panda-link.pandastar { background: linear-gradient(135deg, #fef5e8, #fbe9d4); border-color: #e0cbaa; }
    .panda-link.pandastar:hover { background: linear-gradient(135deg, #fce9d2, #f5d4ad); }

    .result-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px;
      margin: 12px 0 8px;
    }
    .result-card {
      background: var(--surface); border-radius: var(--radius-lg); padding: 14px 18px;
      border: 1.5px solid var(--border); cursor: pointer;
      transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
      display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-sm);
    }
    .result-card:hover { background: var(--surface); border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .result-card .status-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.8);
    }
    .result-card .status-dot.complete { background: #2d8a4e; }
    .result-card .status-dot.incomplete { background: #e8a030; }
    .result-card .name { font-weight: 700; font-size: 1.1rem; color: var(--text); }
    .result-card .seen-icon { font-size: 0.88rem; color: #e8a030; margin-left: 2px; }
    .result-card .alias-text { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
    .result-card .sub { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
    .result-card .gender-badge {
      display: inline-block; background: #ebe5d8; padding: 1px 12px; border-radius: var(--radius-lg);
      font-size: 0.72rem; margin-left: 8px; font-weight: 500;
    }
    .result-card .gender-badge.female { background: var(--pink-tag-bg); color: var(--pink-tag-fg); }
    .result-card .gender-badge.male { background: var(--blue-tag-bg); color: var(--blue-tag-fg); }

    .empty-state { color: var(--text-muted); padding: 28px 8px; text-align: center; }
    .import-label { cursor: pointer; }
    .import-label input[type="file"] { display: none; }

    .page-view .page-header {
      display: flex; align-items: center; padding: 2px 0 18px 0;
      border-bottom: 1px solid var(--border); margin-bottom: 16px; gap: 12px;
    }
    .page-view .page-header .back-btn {
      background: none; border: none; font-size: 1rem; color: var(--text-muted);
      cursor: pointer; padding: 6px 12px; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0; border-radius: var(--radius-md); transition: all 0.18s;
    }
    .page-view .page-header .back-btn:hover { background: var(--bg); color: var(--primary); }
    .page-view .page-header .page-title {
      font-size: 1.3rem; font-weight: 700; color: var(--primary);
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ===== 详情页顶部：头像 + 名字 + 见过开关 ===== */
    .detail-top {
      display: flex; gap: 16px; align-items: center;
      padding: 6px 0 18px 0;
      border-bottom: 1px solid var(--border); margin-bottom: 16px; flex-wrap: wrap;
    }
    .detail-avatar {
      position: relative; width: 84px; height: 84px;
      border-radius: var(--radius-md); overflow: hidden; flex-shrink: 0;
      background: linear-gradient(135deg, #f5f0e6, #eef5ea);
      border: 2.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.6rem; color: #c5bcad; cursor: pointer;
      transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
      box-shadow: var(--shadow-sm);
    }
    .detail-avatar:hover { border-color: var(--primary-light); box-shadow: var(--shadow-md); transform: scale(1.04); }
    .detail-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .detail-avatar .avatar-placeholder { font-size: 3rem; color: #d6cec0; }
    .detail-avatar .seen-badge-overlay {
      position: absolute; bottom: 4px; right: 4px;
      background: rgba(255,255,255,0.95); border-radius: var(--radius-lg);
      padding: 2px 10px; font-size: 0.6rem; font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      border: 1px solid #e8dcc8;
      display: flex; align-items: center; gap: 3px;
      cursor: pointer; user-select: none; transition: 0.18s; line-height: 1.6;
    }
    .detail-avatar .seen-badge-overlay:hover { transform: scale(1.08); }
    .detail-avatar .seen-badge-overlay.seen { background: #fdf5e2; color: #b08030; border-color: #f0dba0; }
    .detail-avatar .seen-badge-overlay.not-seen { background: var(--bg); color: var(--text-muted); border-color: var(--border); }

    .detail-name-area { flex: 1; min-width: 120px; }
    .detail-name-area .panda-name { font-size: 1.45rem; font-weight: 700; color: var(--primary); line-height: 1.2; }
    .detail-name-area .panda-alias { font-size: 0.85rem; color: var(--text-muted); font-weight: 400; margin-left: 4px; }
    .detail-name-area .panda-age { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .detail-name-area .panda-tags { display: flex; flex-wrap: wrap; gap: 5px 8px; margin-top: 6px; }
    .detail-name-area .panda-tags .tag {
      display: inline-block; padding: 2px 12px; border-radius: var(--radius-lg);
      font-size: 0.72rem; font-weight: 500; background: var(--bg); color: var(--text-muted);
    }
    .detail-name-area .panda-tags .tag.female { background: var(--pink-tag-bg); color: var(--pink-tag-fg); }
    .detail-name-area .panda-tags .tag.male { background: var(--blue-tag-bg); color: var(--blue-tag-fg); }
    .detail-name-area .panda-tags .tag.complete { background: #d4e8d4; color: #1a5a2a; }
    .detail-name-area .panda-tags .tag.incomplete { background: #fef3d6; color: #8a7020; }

    .detail-top-actions { display: flex; gap: 8px; flex-shrink: 0; margin-left: auto; }
    .detail-top-actions .relation-btn {
      background: var(--primary-gradient); color: white; border: none;
      border-radius: var(--radius-lg); padding: 8px 16px;
      font-size: 0.82rem; font-weight: 500; cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
      box-shadow: 0 2px 6px rgba(58,90,58,0.2);
    }
    .detail-top-actions .relation-btn:hover {
      transform: translateY(-2px); box-shadow: 0 4px 12px rgba(58,90,58,0.35);
    }

    .detail-info-list,
    .life-events-section {
      background: var(--surface-warm); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }
    .detail-relations { margin-bottom: 16px; }
    .detail-relation-group {
      background: var(--surface-warm); border-radius: var(--radius-md);
      padding: 8px 6px 6px; margin-bottom: 10px; border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .detail-relation-group:last-child { margin-bottom: 0; }

    .detail-relations .empty-state { margin-bottom: 0; }

    .detail-info-item {
      display: flex; padding: 6px 0;
      border-bottom: 1px solid rgba(232,221,208,0.5); font-size: 0.92rem;
    }
    .detail-info-item:last-child { border-bottom: none; }
    .detail-info-item .label {
      color: var(--text-muted); min-width: 76px; font-weight: 500;
      flex-shrink: 0; text-align: left;
    }
    .detail-info-item .value {
      color: var(--text); font-weight: 500; word-break: break-word; flex: 1;
    }
    .detail-info-item .value .gender-badge {
      background: #ebe5d8; padding: 1px 12px; border-radius: var(--radius-lg); font-size: 0.78rem;
    }
    .detail-info-item .value .status-badge {
      display: inline-block; padding: 2px 14px; border-radius: var(--radius-lg);
      font-size: 0.78rem; font-weight: 500;
    }
    .detail-info-item .value .status-badge.complete { background: #d4e8d4; color: #1a5a2a; }
    .detail-info-item .value .status-badge.incomplete { background: #fef3d6; color: #8a7020; }

    .life-events-section .section-title {
      font-weight: 600; font-size: 0.95rem; color: var(--primary); margin-bottom: 10px;
    }
    .life-events-section .event-item {
      display: flex; align-items: baseline; padding: 5px 0;
      border-bottom: 1px solid rgba(232,221,208,0.4); font-size: 0.88rem;

      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }

    .tree-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .tree-modal-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--primary);
    }
    .tree-modal-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--text-muted);

      border-radius: 6px;

    .tree-modal-close:hover { background: #f0eeea; color: var(--text); }
    .tree-modal-body {

    .tree-legend-line { width: 22px; height: 0; border-top: 2px solid var(--primary-light); }
    .tree-legend-line.marriage { border-top: 2px dashed #d4a870; }

    /* 树画布 */
    .tree-canvas {
      position: relative;
      margin: 0 auto;
    }
    .tree-svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;

    .tree-svg line.marriage { stroke: #d4a870; stroke-width: 1.5; stroke-dasharray: 3,2; }
    .tree-svg line.parent-child { stroke: var(--primary-light); stroke-width: 1.5; }

    .tree-node {
      position: absolute;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 7px 12px;
      min-width: 64px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(107,142,90,0.06);

      cursor: pointer;
      transition: all 0.2s;

    .tree-node:hover {
      border-color: var(--primary);

      box-shadow: 0 4px 12px rgba(107,142,90,0.12);

    .tree-node.current {

    /* 家族树按钮 */

<script>
(function(){
  // ================================================================
  // 数据层
  // ================================================================
  const STORAGE_KEY = 'pandaAppData';
  const CACHE_KEY = 'pandaAppData_cloud_cache';
  // 同域 Pages Functions，无需修改
  const CLOUD_API_URL = '/api/data';
  const CLOUD_ENABLED = true;

  // 多条件筛选状态：状态类可多选叠加（AND 关系），年龄可多选叠加（OR 关系），性别单选互斥
  const filterState = {
    complete: false,
    incomplete: false,
    birthday: false,
    seen: false,
    notseen: false,
    pandastar: false,
    ageRanges: new Set(),   // 年龄多选，Set 存储，空=全部年龄
    gender: ''              // 空=全部性别
  };
  let currentPandaId = null;
  let editPandaId = null;
  let detailHistory = [];

  function setStatus(text) {
    const el = document.getElementById('storageStatus');
    if (el) el.textContent = text;
  }

  function migrateAlias(panda) {
    if (!panda) return;
    if (panda.alias !== undefined && panda.alias !== null) return;
    const match = panda.name.match(/^(.+)（(.+)）$/);
    if (match) {
      panda.name = match[1].trim();
      panda.alias = match[2].trim();
    } else {
      panda.alias = '';
    }
  }

  function normalizePanda(p) {
    migrateAlias(p);
    if (p.isComplete === undefined) p.isComplete = false;
    if (p.motherId === undefined) p.motherId = '';
    if (p.fatherId === undefined) p.fatherId = '';
    if (p.lifeEvents === undefined) p.lifeEvents = [];
    if (p.hasSeen === undefined) p.hasSeen = false;
    if (p.photo === undefined) p.photo = '';
  }

  function defaultPandas() {
    return [
      { id: 'p1', name: '花花', gender: '雌性', birthday: '2020-07-04', org: '成都大熊猫繁育研究基地', location: '', mother: '成功', father: '美兰', motherId: '', fatherId: '', pedigree: '', alias: '', isComplete: false, lifeEvents: [], hasSeen: false, photo: '' },
      { id: 'p2', name: '和叶', gender: '雌性', birthday: '2020-07-04', org: '成都大熊猫繁育研究基地', location: '', mother: '成功', father: '美兰', motherId: '', fatherId: '', pedigree: '', alias: '', isComplete: false, lifeEvents: [], hasSeen: false, photo: '' },
      { id: 'p3', name: '萌兰', gender: '雄性', birthday: '2015-07-04', org: '北京动物园', location: '北京', mother: '萌萌', father: '美兰', motherId: '', fatherId: '', pedigree: '', alias: '', isComplete: false, lifeEvents: [], hasSeen: false, photo: '' },
      { id: 'p4', name: '美兰', gender: '雄性', birthday: '2006-09-06', org: '成都大熊猫繁育研究基地', location: '', mother: '伦伦', father: '洋洋', motherId: '', fatherId: '', pedigree: '', alias: '', isComplete: false, lifeEvents: [], hasSeen: false, photo: '' },
      { id: 'p5', name: '成功', gender: '雌性', birthday: '2000-08-01', org: '成都大熊猫繁育研究基地', location: '潘达星', mother: '成成', father: '安安', motherId: '', fatherId: '', pedigree: '', alias: '', isComplete: false, lifeEvents: [], hasSeen: false, photo: '' },
    ];
  }

  function loadLocalData() {
    const stored = localStorage.getItem(CACHE_KEY) || localStorage.getItem(STORAGE_KEY);
    if (stored) {
      try {
        const data = JSON.parse(stored);
        if (Array.isArray(data) && data.length > 0) {
          data.forEach(normalizePanda);
          return data;
        }
      } catch (e) {}
    }
    return defaultPandas();
  }

  async function fetchCloudData() {
    if (!CLOUD_ENABLED) return null;
    try {
      const res = await fetch(CLOUD_API_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      if (Array.isArray(data) && data.length > 0) {
        data.forEach(normalizePanda);
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
        return data;
      }
      return [];
    } catch (e) {
      console.warn('[cloud] fetch failed:', e);
      return null;
    }
  }

  async function pushCloudData(token) {
    if (!CLOUD_ENABLED) return { skipped: true };
    const res = await fetch(CLOUD_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Write-Token': token },
      body: JSON.stringify(pandas)
    });
    if (res.status === 401) { const e = new Error('密码错误'); e.code = 401; throw e; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  let pandas = [];
  let nextId = 100;
  function recalcNextId() {
    const ids = pandas.map(p => { const n = parseInt(String(p.id).replace('p','')); return isNaN(n)?0:n; });
    nextId = (ids.length ? Math.max(...ids) : 0) + 1;
  }

  async function bootstrap() {
    setStatus('⏳ 正在连接云端...');
    const cloud = await fetchCloudData();
    if (cloud && cloud.length > 0) {
      pandas = cloud;
      recalcNextId();
      setStatus('☁️ ' + pandas.length + ' 条已同步云端');
    } else if (cloud && cloud.length === 0) {
      pandas = loadLocalData();
      recalcNextId();
      setStatus('📴 云端为空，使用本地 ' + pandas.length + ' 条');
    } else {
      pandas = loadLocalData();
      recalcNextId();
      setStatus('📴 无法连接云端，本地 ' + pandas.length + ' 条');
    }
    renderBrowse();
  }

  async function saveData() {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(pandas)); } catch (e) {}
    if (!CLOUD_ENABLED) {
      setStatus('💾 ' + pandas.length + ' 条已保存');
      return;
    }
    const token = sessionStorage.getItem('panda_write_token');
    if (!token) {
      setStatus('💾 本地已保存（下次编辑时同步云端）');
      return;
    }
    try {
      await pushCloudData(token);
      setStatus('☁️ ' + pandas.length + ' 条已同步到云端');
    } catch (e) {
      if (e.code === 401) {
        sessionStorage.removeItem('panda_write_token');
        setStatus('❌ 密码错误，仅本地保存');
      } else {
        setStatus('📴 网络异常，已保存到本地');
      }
    }
  }

  // ================================================================
  // 图片压缩工具
  // ================================================================
  function compressImage(file, maxWidth = 600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            const ratio = maxWidth / width;
            width = maxWidth;
            height = Math.round(height * ratio);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/webp', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }


  // ================================================================
  // DOM 引用
  // ================================================================
  const pageHome = document.getElementById('pageHome');
  const pageDetail = document.getElementById('pageDetail');
  const pageEdit = document.getElementById('pageEdit');
  const pageRelation = document.getElementById('pageRelation');
  const homeTitle = document.getElementById('homeTitle');

  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const searchSuggestions = document.getElementById('searchSuggestions');
  const browseContainer = document.getElementById('browseContainer');
  const exportBtn = document.getElementById('exportBtn');
  const exportDropdown = document.getElementById('exportDropdown');
  const importInput = document.getElementById('importInput');
  const addNewBtn = document.getElementById('addNewBtn');

  // ===== 多条件筛选系统初始化 =====
  const ageFilterGroup = document.getElementById('ageFilterGroup');
  const genderFilterGroup = document.getElementById('genderFilterGroup');
  const filterCountInfo = document.getElementById('filterCountInfo');

  // 根据生日算年龄（岁，按生日未过生日算）
  function getAgeYears(birthdayStr) {
    if (!birthdayStr) return null;
    const isStandard = /^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(birthdayStr);
    let year = null, month = 5, day = 30;
    if (isStandard) {
      const cleaned = birthdayStr.replace(/\s+/g, '');
      let match = cleaned.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (match) { year = parseInt(match[1]); month = parseInt(match[2]) - 1; day = parseInt(match[3]); }
      if (!match) {
        try { const d = new Date(birthdayStr);
          if (!isNaN(d.getTime())) { year = d.getFullYear(); month = d.getMonth(); day = d.getDate(); } } catch(e) {} }
    } else {
      const yearMatch = birthdayStr.match(/^(\d{4})/);
      if (yearMatch) {
        year = parseInt(yearMatch[1]); month = 8; day = 1;
      }
    }
    if (year === null || isNaN(year)) return null;
    const birthDate = new Date(year, month, day);
    if (isNaN(birthDate.getTime())) return null;
    const today = new Date();
    let age = today.getFullYear() - birthDate.getFullYear();
    const hasBirthdayPassed = (today.getMonth() > birthDate.getMonth()) ||
      (today.getMonth() === birthDate.getMonth() && today.getDate() >= birthDate.getDate());
    if (!hasBirthdayPassed) age--;
    return Math.max(0, age);
  }

  function setAgeRange(range) {
    // 点击"全部年龄"按钮 → 清空所有年龄选择
    if (range === '') {
      filterState.ageRanges.clear();
      ageFilterGroup.querySelectorAll('[data-age]').forEach(b => {
        b.classList.remove('active');
        if (b.dataset.age === '') b.classList.add('active');
      });
    } else {
      // 点击具体年龄段 → toggle
      if (filterState.ageRanges.has(range)) {
        filterState.ageRanges.delete(range);
      } else {
        filterState.ageRanges.add(range);
      }
      // 更新按钮 active 状态
      ageFilterGroup.querySelectorAll('[data-age]').forEach(b => {
        if (b.dataset.age === '') {
          b.classList.toggle('active', filterState.ageRanges.size === 0);
        } else {
          b.classList.toggle('active', filterState.ageRanges.has(b.dataset.age));
        }
      });
    }
    collapseState = {};
    renderBrowse();
  }

  function setGenderFilter(gender) {
    filterState.gender = gender;
    genderFilterGroup.querySelectorAll('[data-gender]').forEach(b => {
      b.classList.toggle('active', b.dataset.gender === gender);
    });
    collapseState = {};
    renderBrowse();
  }

  // 切换状态类筛选（多选叠加）
  function toggleStatusFilter(key, btn) {
    filterState[key] = !filterState[key];
    btn.classList.toggle('active', filterState[key]);
    collapseState = {};
    renderBrowse();
  }

  function clearAllFilters() {
    Object.keys(filterState).forEach(k => {
      if (k === 'ageRanges') filterState[k].clear();
      else if (k === 'gender') filterState[k] = '';
      else filterState[k] = false;
    });
    // 清空搜索框
    searchInput.value = '';
    // 重置年龄按钮
    ageFilterGroup.querySelectorAll('[data-age]').forEach(b => {
      b.classList.toggle('active', b.dataset.age === '');
    });
    // 重置性别按钮

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const isStandard = /^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(dateStr);
    if (!isStandard) return dateStr;
    try {

  // ================================================================
  // 家族树功能（垂直版 · 叶子槽位法）
  // ================================================================

  // 递归追溯祖先关系
  // 返回 { relations: { childId: { motherId, fatherId } }, nodes: Map }
  // 停止条件：无父母记录、父母来自野外、或循环引用
  function buildAncestryData(rootPandaId) {
    const relations = {};     // childKey -> { motherKey, fatherKey }
    const nodes = new Map();  // key -> { key, name, gender, location, pandastar, seen, isWild }
    const visited = new Set(); // 防止循环

    // key 可以是 pandaId，也可以是 wild_mother / wild_father
    function resolveMotherKey(p) {
      if (p.motherId) return p.motherId;
      if (p.mother && p.mother.trim()) return 'name:' + p.mother.trim();
      return null;
    }
    function resolveFatherKey(p) {
      if (p.fatherId) return p.fatherId;
      if (p.father && p.father.trim()) return 'name:' + p.father.trim();
      return null;
    }

    function keyToPanda(key) {
      if (!key) return null;
      if (key.startsWith('name:')) {
        const name = key.slice(5);
        return pandas.find(p => p.name === name) || null;
      }
      return getPandaById(key);
    }

    function trace(key) {
      if (!key || visited.has(key)) return;
      visited.add(key);

      let p = keyToPanda(key);
      let isWild = false;

      if (!p) {
        // 未在数据库中找到（可能是未关联的名字引用）
        // 创建一个虚拟节点
        let name = key.startsWith('name:') ? key.slice(5) : key;
        nodes.set(key, {
          key, name, gender: '未知',
          location: '', pandastar: false, seen: false, isWild: false, isVirtual: true
        });
        return;
      }

      const location = p.location || '';
      nodes.set(key, {
        key,
        name: p.name,
        gender: p.gender || '未知',
        location,
        pandastar: location.trim() === '潘达星',
        seen: p.hasSeen === true,
        isWild: false,
        isVirtual: false,
        panda: p
      });

      const mKey = resolveMotherKey(p);
      const fKey = resolveFatherKey(p);

      // 检查是否来自野外
      const isMotherWild = mKey === 'wild_mother' || (p.mother && p.mother.includes('野外'));
      const isFatherWild = fKey === 'wild_father' || (p.father && p.father.includes('野外'));

      if (mKey && !isMotherWild) trace(mKey);
      if (fKey && !isFatherWild) trace(fKey);

      // 如果是野外，不创建虚拟节点（野外节点不加入树）
      if (mKey || fKey || isMotherWild || isFatherWild) {
        relations[key] = {
          motherKey: isMotherWild ? null : mKey,
          fatherKey: isFatherWild ? null : fKey,
          motherWild: isMotherWild,
          fatherWild: isFatherWild
        };
      }
    }

    trace(rootPandaId);

    return { relations, nodes };
  }

  // 渲染家族树到模态框
  function openFamilyTree(rootPandaId) {
    const modal = document.getElementById('familyTreeModal');
    const body = document.getElementById('treeModalBody');

    const { relations, nodes } = buildAncestryData(rootPandaId);
    const rootPanda = getPandaById(rootPandaId);
    const rootName = rootPanda ? rootPanda.name : '熊猫';

    if (nodes.size <= 1) {
      body.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:40px 20px;">
        <div style="font-size:2rem;margin-bottom:12px;">🌱</div>
        <div style="font-weight:600;margin-bottom:4px;">${rootName}的家族关系不多</div>
        <div style="font-size:0.85rem;">还没有录入父母信息，或父母来自野外</div>
      </div>`;
      modal.classList.add('active');
      return;
    }

    // ===== 布局参数 =====
    const SLOT_W = 110;
    const NODE_W = 76;
    const NODE_H = 34;
    const V_GAP = 68;

    // ===== 计算深度 =====
    function getNodeDepth(key, visited) {
      if (visited.has(key)) return 0;
      visited.add(key);
      const rel = relations[key];
      if (!rel || (!rel.motherKey && !rel.fatherKey)) return 0;
      let d = 0;
      if (rel.motherKey) d = Math.max(d, getNodeDepth(rel.motherKey, new Set(visited)));
      if (rel.fatherKey) d = Math.max(d, getNodeDepth(rel.fatherKey, new Set(visited)));
      return d + 1;
    }
    const maxDepth = getNodeDepth(rootPandaId, new Set());

    // ===== 叶子槽位分配 =====
    let leafCounter = 0;
    const slots = {};
    function assignSlots(key) {
      if (slots[key] !== undefined) return slots[key];
      const rel = relations[key];
      if (!rel || (!rel.motherKey && !rel.fatherKey)) {
        slots[key] = leafCounter++;
        return slots[key];
      }
      let mSlot = null, fSlot = null;
      if (rel.motherKey) mSlot = assignSlots(rel.motherKey);
      if (rel.fatherKey) fSlot = assignSlots(rel.fatherKey);
      if (mSlot !== null && fSlot !== null) {
        slots[key] = (mSlot + fSlot) / 2;
      } else if (mSlot !== null) {
        slots[key] = mSlot;
      } else if (fSlot !== null) {
        slots[key] = fSlot;
      } else {
        slots[key] = leafCounter++;
      }
      return slots[key];
    }
    assignSlots(rootPandaId);

    // ===== 收集节点位置 =====
    const positions = {};
    function collect(key, level) {
      if (positions[key] !== undefined) return;
      if (!nodes.has(key)) return;
      const slot = slots[key];
      positions[key] = {
        x: slot * SLOT_W + SLOT_W / 2,
        y: level * (NODE_H + V_GAP),
        level
      };
      const rel = relations[key];
      if (rel) {
        if (rel.motherKey) collect(rel.motherKey, level - 1);
        if (rel.fatherKey) collect(rel.fatherKey, level - 1);
      }
    }
    collect(rootPandaId, maxDepth);

    // ===== 生成连线 =====
    const lines = [];
    Object.keys(relations).forEach(childKey => {
      const child = positions[childKey];
      if (!child) return;
      const rel = relations[childKey];
      if (rel.motherKey) {
        const mPos = positions[rel.motherKey];
        if (mPos) {
          const marriageY = mPos.y + NODE_H / 2;
          // 母亲到婚配中点（水平）
          if (rel.fatherKey && positions[rel.fatherKey]) {
            const fPos = positions[rel.fatherKey];
            const fMarriageY = fPos.y + NODE_H / 2;
            // 婚配虚线
            if (Math.abs(marriageY - fMarriageY) < 2) {
              lines.push({
                x1: mPos.x + NODE_W / 2, y1: marriageY,
                x2: fPos.x - NODE_W / 2, y2: marriageY,
                type: 'marriage'
              });
            }
            // 亲子垂线
            const midX = (mPos.x + fPos.x) / 2;
            lines.push({
              x1: midX, y1: marriageY,
              x2: child.x, y2: child.y,
              type: 'parent-child'
            });
          } else {
            // 只有母亲，直接竖线连下来
            lines.push({
              x1: mPos.x, y1: marriageY,
              x2: child.x, y2: child.y,
              type: 'parent-child'
            });
          }
        }
      } else if (rel.fatherKey) {
        // 只有父亲
        const fPos = positions[rel.fatherKey];
        if (fPos) {
          const fMarriageY = fPos.y + NODE_H / 2;
          lines.push({
            x1: fPos.x, y1: fMarriageY,
            x2: child.x, y2: child.y,
            type: 'parent-child'
          });
        }
      }
    });

    // ===== 渲染 =====
    const totalWidth = Math.max(leafCounter * SLOT_W, 300);
    const totalHeight = (maxDepth + 1) * (NODE_H + V_GAP) + 20;

    let html = `<div class="tree-canvas" id="familyTreeCanvas" style="width:${totalWidth}px;height:${totalHeight}px;">`;
    html += `<svg class="tree-svg" width="${totalWidth}" height="${totalHeight}">`;
    lines.forEach(l => {
      html += `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" class="${l.type}"/>`;
    });
    html += `</svg>`;

    nodes.forEach((node, key) => {
      if (!positions[key]) return;
      const pos = positions[key];
      const genderIcon = node.gender === '雌' || node.gender === '雌性' ? '♀' :
                         node.gender === '雄' || node.gender === '雄性' ? '♂' : '';
      const seenIcon = node.seen ? '<span class="seen">👀</span>' : '';
      const cls = [
        'tree-node',
        key === rootPandaId ? 'current' : '',
        node.pandastar ? 'pandastar' : '',
        node.isVirtual ? 'virtual' : ''
      ].filter(Boolean).join(' ');

      const clickAttr = node.panda ? `data-panda-id="${node.panda.id}"` : '';
      const cursor = node.panda ? '' : 'style="cursor:default;"';

      html += `<div class="${cls}" style="left:${pos.x}px;top:${pos.y}px;" ${clickAttr} ${cursor}>
        ${seenIcon}${node.name}${genderIcon ? `<span class="gender">${genderIcon}</span>` : ''}
      </div>`;
    });

    html += `</div>`;
    body.innerHTML = html;

    // ===== 节点点击事件 =====
    body.querySelectorAll('.tree-node[data-panda-id]').forEach(el => {
      el.addEventListener('click', function() {
        const pid = this.dataset.pandaId;
        closeFamilyTree();
        openDetail(pid);
      });
    });

    modal.classList.add('active');
  }

  function calcAge(birthdayStr) {
    if (!birthdayStr || birthdayStr.trim() === '') return null;
    const isStandard = /^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(birthdayStr);
    if (!isStandard) {
      const yearMatch = birthdayStr.match(/^(\d{4})/);
      if (yearMatch) {
        const year = parseInt(yearMatch[1]);
        const birth = new Date(year, 8, 1);
        if (isNaN(birth.getTime())) return null;
        const now = new Date();
        let years = now.getFullYear() - birth.getFullYear();
        let months = now.getMonth() - birth.getMonth();
        if (months < 0) { years--; months += 12; }
        if (years < 0) return null;
        if (years === 0 && months === 0) return '不到1个月';
        let parts = [];
        if (years > 0) parts.push(years + '岁');
        if (months > 0) parts.push(months + '个月');
        return parts.join('') || (years + '岁');
      }
      return null;
    }
    let year = null, month = null, day = null;
    const cleaned = birthdayStr.replace(/\s+/g, '');
    let match = cleaned.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (match) { year = parseInt(match[1]); month = parseInt(match[2])-1; day = parseInt(match[3]); }
    if (!match) {
      try { const d = new Date(birthdayStr);
        if (!isNaN(d.getTime())) { year = d.getFullYear(); month = d.getMonth(); day = d.getDate(); } } catch(e) {} }
    if (year === null || isNaN(year)) return null;
    if (month === null || isNaN(month)) month = 5;
    if (day === null || isNaN(day)) day = 30;
    month = Math.max(0, Math.min(11, month));
    day = Math.max(1, Math.min(30, day));
    const birth = new Date(year, month, day);
    if (isNaN(birth.getTime())) return null;
    const now = new Date();
    let years = now.getFullYear() - birth.getFullYear();
    let months = now.getMonth() - birth.getMonth();
    if (months < 0) { years--; months += 12; }
    if (years < 0) return null;
    if (years === 0 && months === 0) return '不到1个月';
    let parts = [];
    if (years > 0) parts.push(years + '岁');
    if (months > 0) parts.push(months + '个月');
    return parts.join('') || (years + '岁');
  }

  function getAgeGroup(birthdayStr) {
    if (!birthdayStr) return null;
    const isStandard = /^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(birthdayStr);
    let year = null, month = 5, day = 30;
    if (isStandard) {
      const cleaned = birthdayStr.replace(/\s+/g, '');
      let match = cleaned.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (match) { year = parseInt(match[1]); month = parseInt(match[2])-1; day = parseInt(match[3]); }
      if (!match) {
        try { const d = new Date(birthdayStr);
          if (!isNaN(d.getTime())) { year = d.getFullYear(); month = d.getMonth(); day = d.getDate(); } } catch(e) {} }
    } else {
      const yearMatch = birthdayStr.match(/^(\d{4})/);
      if (yearMatch) {
        year = parseInt(yearMatch[1]);
        month = 8;
        day = 1;
      }
    }
    if (year === null || isNaN(year)) return null;
    month = Math.max(0, Math.min(11, month));
    day = Math.max(1, Math.min(30, day));
    const birth = new Date(year, month, day);
    if (isNaN(birth.getTime())) return null;
    const now = new Date();
    let years = now.getFullYear() - birth.getFullYear();
    if (now.getMonth() < birth.getMonth() || (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate())) {
      years--;
    }
    if (years < 0) return null;
    if (years < 5) return '0-5岁';
    if (years < 10) return '5-10岁';
    if (years < 15) return '10-15岁';
    if (years < 20) return '15-20岁';
    if (years < 25) return '20-25岁';
    if (years < 30) return '25-30岁';
    return '30岁以上';
  }

  function isTodayBirthday(birthdayStr) {
    if (!birthdayStr) return false;
    const isStandard = /^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(birthdayStr);
    if (!isStandard) return false;
    try {
      const d = new Date(birthdayStr);
      if (isNaN(d.getTime())) return false;
      const today = new Date();
      return d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
    } catch { return false; }
  }

  function getRelationships(panda) {
    if (!panda) return { parents:[], siblingsSameParents:[], siblingsSameMother:[], siblingsSameFather:[], children:[], spouse:[] };
    const name = panda.name;
    let motherPanda = null;
    let fatherPanda = null;
    let motherName = '';
    let fatherName = '';

    if (panda.motherId) motherPanda = getPandaById(panda.motherId);
    if (!motherPanda && panda.mother && !isWild(panda.mother)) motherPanda = findPandaByName(panda.mother);
    if (motherPanda) motherName = motherPanda.name;

    if (panda.fatherId) fatherPanda = getPandaById(panda.fatherId);
    if (!fatherPanda && panda.father && !isWild(panda.father)) fatherPanda = findPandaByName(panda.father);
    if (fatherPanda) fatherName = fatherPanda.name;

    const parents = [];
    if (panda.mother && isWild(panda.mother)) {
      parents.push({ id: 'wild_mother', name: '🌿 野外', isWild: true });
    } else if (motherPanda) {
      parents.push({ ...motherPanda, isWild: false });
    } else if (panda.mother && panda.mother.trim() !== '') {
      parents.push({ id: 'unlinked_mother', name: panda.mother + ' (未关联)', isWild: false, unlinked: true });
    }
    if (panda.father && isWild(panda.father)) {
      parents.push({ id: 'wild_father', name: '🌿 野外', isWild: true });
    } else if (fatherPanda) {
      parents.push({ ...fatherPanda, isWild: false });
    } else if (panda.father && panda.father.trim() !== '') {
      parents.push({ id: 'unlinked_father', name: panda.father + ' (未关联)', isWild: false, unlinked: true });
    }

    const children = pandas.filter(p => {
      if (p.id === panda.id) return false;
      if (p.motherId && p.motherId === panda.id) return true;
      if (p.fatherId && p.fatherId === panda.id) return true;
      if (!p.motherId && p.mother && p.mother.trim() === name) return true;
      if (!p.fatherId && p.father && p.father.trim() === name) return true;
      return false;
    });

    const siblingsSameParents = [], siblingsSameMother = [], siblingsSameFather = [];
    pandas.forEach(p => {
      if (p.id === panda.id) return;
      let pMother = null, pFather = null;
      if (p.motherId) pMother = getPandaById(p.motherId);
      if (!pMother && p.mother && !isWild(p.mother)) pMother = findPandaByName(p.mother);
      if (p.fatherId) pFather = getPandaById(p.fatherId);
      if (!pFather && p.father && !isWild(p.father)) pFather = findPandaByName(p.father);
      const sameMother = motherPanda && pMother && motherPanda.id === pMother.id;
      const sameFather = fatherPanda && pFather && fatherPanda.id === pFather.id;
      if (sameMother && sameFather) siblingsSameParents.push(p);
      else if (sameMother && !sameFather) siblingsSameMother.push(p);
      else if (sameFather && !sameMother) siblingsSameFather.push(p);
    });

    const spouse = [];
    const myChildrenIds = children.map(c => c.id);
    pandas.forEach(p => {
      if (p.id === panda.id) return;
      if (parents.some(par => par.id === p.id)) return;
      if (children.some(child => child.id === p.id)) return;
      const pChildren = pandas.filter(c => {
        if (c.motherId && c.motherId === p.id) return true;
        if (c.fatherId && c.fatherId === p.id) return true;
        if (!c.motherId && c.mother && c.mother.trim() === p.name) return true;
        if (!c.fatherId && c.father && c.father.trim() === p.name) return true;
        return false;
      });
      if (pChildren.some(c => myChildrenIds.includes(c.id))) spouse.push(p);
    });

    // 按生日从早到晚排序；生日相同则谱系号小的在前；无生日排最后
    // 生日补全规则：只有年份→9月1日，只有年月→当月1日，都没有→排最后
    const dateVal = (d) => {
      if (!d) return 99999999;
      const s = String(d).replace(/[/.]/g, '-');
      const parts = s.split('-').map(x => parseInt(x) || 0);
      if (!parts[0]) return 99999999;        // 年都没有 → 排最后
      if (parts.length === 1) {
        return parts[0] * 10000 + 9 * 100 + 1; // 只有年份 → 9月1日
      } else if (!parts[2]) {
        return parts[0] * 10000 + (parts[1] || 1) * 100 + 1; // 只有年月 → 当月1日
      } else {
        return parts[0] * 10000 + parts[1] * 100 + parts[2]; // 完整日期
      }
    };
    const pedVal = (p) => {
      const n = parseInt(p.pedigree);
      return isNaN(n) ? 999999999 : n;
    };
    const sortByAge = (arr) => arr.sort((a, b) => {
      const va = dateVal(a.birthday), vb = dateVal(b.birthday);
      if (va !== vb) return va - vb;
      return pedVal(a) - pedVal(b);
    });
    sortByAge(children); sortByAge(spouse); sortByAge(siblingsSameParents);
    sortByAge(siblingsSameMother); sortByAge(siblingsSameFather);
    return { parents, siblingsSameParents, siblingsSameMother, siblingsSameFather, children, spouse };
  }

  function getDistinctValues(field) {
    const values = new Set();
    pandas.forEach(p => {
      const v = p[field] || '';
      if (v.trim()) values.add(v.trim());
    });
    return Array.from(values).sort();
  }

  function updateStats() {
    const total = pandas.length;
    const male = pandas.filter(p => p.gender === '雄性').length;
    const female = pandas.filter(p => p.gender === '雌性').length;
    const orgs = new Set(pandas.map(p => p.org || '未归类'));
    const complete = pandas.filter(p => p.isComplete === true).length;
    const incomplete = total - complete;
    const birthday = pandas.filter(p => isTodayBirthday(p.birthday)).length;
    const seen = pandas.filter(p => p.hasSeen === true).length;
    totalCount.textContent = total;
    maleCount.textContent = male;
    femaleCount.textContent = female;
    orgCount.textContent = orgs.size;
    completeCount.textContent = complete;
    incompleteCount.textContent = incomplete;
    birthdayCount.textContent = birthday;
    seenCount.textContent = seen;
  }

  // ================================================================
  //  时光机：某年今日
  // ================================================================
  function renderTimeMachine() {
    const now = new Date();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const todayMMDD = mm + '-' + dd;
    const year = now.getFullYear();

    // 1) 今天生日的熊猫
    const birthdayPandas = [];
    pandas.forEach(p => {
      if (!p.birthday) return;
      // 排除已经离世的（所在地为潘达星）
      if (p.location && p.location.includes('潘达星')) return;
      // 兼容各种日期格式：2020-07-04 / 2020/7/4 / 2020.7.4
      const bStr = String(p.birthday).replace(/[/.]/g, '-');
      const parts = bStr.split('-');
      if (parts.length < 2) return;
      const bMonth = parseInt(parts[1]);
      const bDay = parseInt(parts[2]);
      if (bMonth === now.getMonth() + 1 && bDay === now.getDate()) {
        const birthYear = parseInt(parts[0]);
        const age = birthYear ? year - birthYear : null;
        birthdayPandas.push({ name: p.name, age: age, birthday: p.birthday, id: p.id });
      }
    });

    // 2) 历史上的今天（从 lifeEvents 提取）
    const historyEvents = [];
    pandas.forEach(p => {
      const events = p.lifeEvents || [];
      events.forEach(ev => {
        if (!ev.date) return;
        if (ev.date.slice(5) === todayMMDD) {
          const evYear = parseInt(ev.date.slice(0, 4));
          historyEvents.push({
            year: evYear,
            ago: year - evYear,
            pandaName: p.name,
            text: ev.event,
            date: ev.date
          });
        }
      });
    });
    historyEvents.sort((a, b) => b.year - a.year);

    // 3) 潘达星熊猫的生日（作为历史事件）
    pandas.forEach(p => {
      if (!p.birthday) return;
      if (!p.location || !p.location.includes('潘达星')) return;
      const bStr = String(p.birthday).replace(/[/.]/g, '-');
      const parts = bStr.split('-');
      if (parts.length < 3) return;
      const bMonth = parseInt(parts[1]);
      const bDay = parseInt(parts[2]);
      if (bMonth === now.getMonth() + 1 && bDay === now.getDate()) {
        const birthYear = parseInt(parts[0]);
        historyEvents.push({
          year: birthYear,
          ago: year - birthYear,
          pandaName: p.name,
          text: '出生了 🐼✨',
          date: p.birthday,
          isBirthday: true
        });
      }
    });
    historyEvents.sort((a, b) => b.year - a.year);

    // 渲染
    let html = "";

    // 生日部分
    html += '<div class="time-machine-section"><h3>🎂 今天生日</h3>';
    if (birthdayPandas.length === 0) {
      html += '<div class="no-event">今天没有熊猫过生日 🐼</div>';
    } else {
      birthdayPandas.forEach(p => {
        html += '<div class="birthday-panda-card" style="cursor:pointer;" onclick="openDetail(\'' + p.id + '\')">' +
          '<div class="avatar">🎂</div>' +
          '<div class="info">' +
            '<div class="name">' + p.name + '</div>' +
            '<div class="age">今天 ' + p.age + ' 岁啦！</div>' +
          '</div>' +
        '</div>';
      });
    }
    html += '</div>';

    // 历史事件部分
    html += '<div class="time-machine-section"><h3>📅 历史上的今天</h3>';
    if (historyEvents.length === 0) {
      html += '<div class="no-event">今天没有熊生大事记录<br><small style="font-size:12px;">可以去熊猫详情页的「熊生大事」里添加记录哦</small></div>';
    } else {
      historyEvents.forEach(ev => {
        html += '<div class="history-event">' +
          '<div class="year">' + ev.year + ' 年 · 已过去 ' + ev.ago + ' 年</div>' +
          '<div><span class="panda-name">' + ev.pandaName + '</span>' + ev.text + '</div>' +
        '</div>';
      });
    }
    html += '</div>';

    document.getElementById('timeMachineContent').innerHTML = html;
  }

  // ================================================================
  // 主页
  // ================================================================
  function renderBrowse() {
    // === 搜索词（从搜索框叠加进来） ===
    const keyword = searchInput.value.trim().toLowerCase();

    let filtered = pandas.filter(p => {
      // 搜索词 AND 叠加
      if (keyword) {
        const nameMatch = p.name.toLowerCase().includes(keyword);
        const aliasMatch = p.alias && p.alias.toLowerCase().includes(keyword);
        const orgMatch = p.org && p.org.toLowerCase().includes(keyword);
        const locMatch = p.location && p.location.toLowerCase().includes(keyword);
        if (!nameMatch && !aliasMatch && !orgMatch && !locMatch) return false;
      }

      const isPandastar = p.location && p.location.trim() === '潘达星';

      // 状态类筛选（多选叠加，任一勾选即生效）
      if (filterState.complete && p.isComplete !== true) return false;
      if (filterState.incomplete && p.isComplete === true) return false;
      if (filterState.birthday && !isTodayBirthday(p.birthday)) return false;
      if (filterState.seen && p.hasSeen !== true) return false;
      if (filterState.notseen && p.hasSeen !== true) return false;
      if (filterState.pandastar && !isPandastar) return false;

      // 年龄筛选（多选 OR：命中任一选中档即可通过）
      if (filterState.ageRanges.size > 0) {
        const age = getAgeYears(p.birthday);
        if (age === null) return false;  // 生日缺失 → 不符合任何年龄段
        const inRange = (r) => {
          if (r === '0-1') return age >= 0 && age < 1;
          if (r === '1-5') return age >= 1 && age < 5;
          if (r === '5-10') return age >= 5 && age < 10;
          if (r === '10-20') return age >= 10 && age < 20;
          if (r === '20-30') return age >= 20 && age < 30;
          if (r === '30+') return age >= 30;
          return false;
        };
        let hit = false;
        for (const r of filterState.ageRanges) { if (inRange(r)) { hit = true; break; } }
        if (!hit) return false;
      }

      // 性别筛选
      if (filterState.gender) {
        if (filterState.gender === 'unknown') {
          if (p.gender === '雌性' || p.gender === '雄性') return false;
        } else {
          if (p.gender !== filterState.gender) return false;
        }
      }
      return true;
    });

    // === 排序：潘达星排后面，其他按生日从早到晚（年长在前），同名后按谱系号 ===
    const dateVal2 = (d) => {
      if (!d) return 99999999;
      const s = String(d).replace(/[/.]/g, '-');
      const parts = s.split('-').map(x => parseInt(x) || 0);
      if (!parts[0]) return 99999999;
      if (parts.length === 1) return parts[0] * 10000 + 9 * 100 + 1;
      if (!parts[2]) return parts[0] * 10000 + (parts[1] || 1) * 100 + 1;
      return parts[0] * 10000 + parts[1] * 100 + parts[2];
    };
    const pedVal2 = (p) => {
      const n = parseInt(p.pedigree);
      return isNaN(n) ? 999999999 : n;
    };
    filtered.sort((a, b) => {
      const aPs = a.location && a.location.trim() === '潘达星';
      const bPs = b.location && b.location.trim() === '潘达星';
      if (aPs !== bPs) return aPs ? 1 : -1;  // 潘达星排后面
      const va = dateVal2(a.birthday), vb = dateVal2(b.birthday);
      if (va !== vb) return va - vb;
      return pedVal2(a) - pedVal2(b);
    });

    // === 渲染平铺卡片网格 ===
    let html = '';
    if (filtered.length) {
      // 潘达星标记，用于底部提示
      const pandastarCount = filtered.filter(p => p.location && p.location.trim() === '潘达星').length;
      if (pandastarCount > 0 && pandastarCount < filtered.length) {
        html += `<div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:10px;padding:6px 14px;background:var(--surface-warm);border-radius:var(--radius-md);border:1px solid var(--border);">
          🐼 共 ${filtered.length} 只 · 其中 🕊️ 潘达星 ${pandastarCount} 只（已排末尾）
          <button onclick="clearAllFilters()" style="float:right;background:none;border:none;color:var(--primary-light);cursor:pointer;font-size:0.78rem;text-decoration:underline;">清除筛选</button>
        </div>`;
      } else {
        html += `<div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:10px;padding:6px 14px;background:var(--surface-warm);border-radius:var(--radius-md);border:1px solid var(--border);">
          🐼 共 ${filtered.length} 只
          <button onclick="clearAllFilters()" style="float:right;background:none;border:none;color:var(--primary-light);cursor:pointer;font-size:0.78rem;text-decoration:underline;">清除筛选</button>
        </div>`;
      }

      html += '<div class="panda-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;">';
      filtered.forEach(p => {
        const isPandastar = p.location && p.location.trim() === '潘达星';
        const cls = p.gender === '雌性' ? 'female' : (p.gender === '雄性' ? 'male' : '');
        const tag = p.gender ? (p.gender === '雌性' ? '♀' : (p.gender === '雄性' ? '♂' : '')) : '';
        const displayName = getDisplayName(p);
        const dotClass = p.isComplete ? 'complete' : 'incomplete';
        const seenIcon = p.hasSeen ? '<span class="seen-icon">👀</span>' : '';
        const extraCls = isPandastar ? ' pandastar' : '';
        html += `<span class="panda-link${extraCls}" data-id="${p.id}">
          <span class="status-dot ${dotClass}"></span>
          ${displayName}
          ${seenIcon}
          ${tag ? `<span class="gender-tag ${cls}">${tag}</span>` : ''}
        </span>`;
      });
      html += '</div>';
    } else {
      html = '<div class="empty-state">没有符合筛选条件的熊猫，试试清除筛选～</div>';
    }

    browseContainer.innerHTML = html;
    document.querySelectorAll('.panda-link[data-id]').forEach(el => {
      el.addEventListener('click', function() {
        const p = getPandaById(this.dataset.id);
        if (p) openDetail(p.id);
      });
    });
    window.toggleSection = toggleSection;
    updateStats();
    saveData();
  }

  // ================================================================
  // 亲缘关系查询
  // ================================================================
  function findAncestors(panda, maxDepth = 5) {
    if (!panda) return [];
    const results = [];

    function traverse(current, path, depth) {
      if (depth > maxDepth) return;
      if (!current) return;
      const newPath = [...path, current.id];
      results.push({
        ids: newPath,
        names: newPath.map(id => {
          const p = getPandaById(id);
          return p ? { id: p.id, name: p.name, gender: p.gender || '未知' } : null;
        }).filter(Boolean),
        lastId: current.id,
        depth: depth
      });
      const mother = current.motherId ? getPandaById(current.motherId) : null;
      const father = current.fatherId ? getPandaById(current.fatherId) : null;
      if (mother && !isWild(mother.name)) {
        traverse(mother, newPath, depth + 1);
      }
      if (father && !isWild(father.name)) {
        traverse(father, newPath, depth + 1);
      }
    }

    traverse(panda, [], 0);
    return results;
  }

  function findCommonAncestors(pandaA, pandaB, maxDepth = 5) {
    if (!pandaA || !pandaB || pandaA.id === pandaB.id) return [];

    const ancestorsA = findAncestors(pandaA, maxDepth);
    const ancestorsB = findAncestors(pandaB, maxDepth);

    const aPathMap = new Map();
    ancestorsA.forEach(path => {
      const lastId = path.lastId;
      if (!aPathMap.has(lastId) || path.depth < aPathMap.get(lastId).depth) {
        aPathMap.set(lastId, path);
      }
    });

    const bPathMap = new Map();
    ancestorsB.forEach(path => {
      const lastId = path.lastId;
      if (!bPathMap.has(lastId) || path.depth < bPathMap.get(lastId).depth) {
        bPathMap.set(lastId, path);
      }
    });

    const commonIds = [];
    aPathMap.forEach((path, id) => {
      if (bPathMap.has(id)) {
        commonIds.push(id);
      }
    });

    if (commonIds.length === 0) return [];

    const filteredIds = commonIds.filter(id => {
      const pathA = aPathMap.get(id);
      const pathB = bPathMap.get(id);
      const pathToCheck = pathA.ids.length <= pathB.ids.length ? pathA.ids : pathB.ids;
      const otherCommonIds = commonIds.filter(otherId => otherId !== id);
      for (let otherId of otherCommonIds) {
        if (pathToCheck.includes(otherId)) {
          return false;
        }
      }
      return true;
    });

    filteredIds.sort((a, b) => {
      const depthA = aPathMap.get(a).depth;
      const depthB = aPathMap.get(b).depth;
      return depthA - depthB;
    });

    const result = [];
    filteredIds.forEach(id => {
      const pathA = aPathMap.get(id);
      const pathB = bPathMap.get(id);
      if (pathA && pathB) {
        result.push({
          ancestorId: id,
          ancestorName: getPandaById(id)?.name || '未知',
          ancestorGender: getPandaById(id)?.gender || '未知',
          pathA: pathA.names.map(n => ({ id: n.id, name: n.name, gender: n.gender })),
          pathB: pathB.names.map(n => ({ id: n.id, name: n.name, gender: n.gender })),
          depthA: pathA.depth,
          depthB: pathB.depth,
        });
      }
    });

    return result;
  }

  function formatPathForDisplay(path, targetName) {
    if (!path || path.length === 0) return '';
    return path.map(p => {
      const genderIcon = p.gender === '雌性' ? '♀' : (p.gender === '雄性' ? '♂' : '');
      return p.name + genderIcon;
    }).join('-');
  }

  function generateCopyText(pandaA, pandaB, results) {
    if (!results || results.length === 0) {
      return `🐼${pandaA.name}与🐼${pandaB.name}在指定代数内没有找到共同祖先。`;
    }

    let text = `🐼${pandaA.name}与🐼${pandaB.name}的亲缘关系是：\n\n`;
    results.forEach((r, idx) => {
      const reversedPathA = [...r.pathA].reverse();
      const reversedPathB = [...r.pathB].reverse();
      const pathA = formatPathForDisplay(reversedPathA);
      const pathB = formatPathForDisplay(reversedPathB);
      text += `${idx+1}、 ${r.ancestorName}${r.ancestorGender === '雌性' ? '♀' : (r.ancestorGender === '雄性' ? '♂' : '')}\n`;
      text += `${pathA}\n`;
      text += `${pathB}\n\n`;
    });
    return text.trim();
  }

      if (relationPandaB) {

        performRelationQuery(pA, relationPandaB, maxDepth);
      }
    });

  function createRelationSuggestInput(container, options, inputId, initialValue, placeholder) {
    const wrapper = document.createElement('div');
    wrapper.className = 'custom-suggest';
    wrapper.innerHTML = `
      <input type="text" id="${inputId}" value="${initialValue||''}" placeholder="${placeholder||'输入熊猫名字...'}" autocomplete="off" />
      <div class="suggest-dropdown" id="${inputId}_dropdown"></div>
    `;
    container.appendChild(wrapper);

    const input = wrapper.querySelector('input');
    const dropdown = wrapper.querySelector('.suggest-dropdown');

    function renderDropdown(list) {
      if (!list || list.length === 0) {
        dropdown.innerHTML = `<div class="no-match">未找到匹配的熊猫</div>`;
        dropdown.classList.add('show');
        return;
      }
      dropdown.innerHTML = list.map(item =>
        `<div class="suggest-item" data-value="${item.display}">🐼 ${item.display}</div>`
      ).join('');
      dropdown.classList.add('show');
      dropdown.querySelectorAll('.suggest-item').forEach(el => {
        el.addEventListener('click', function() {
          const value = this.dataset.value;
          input.value = value;
          dropdown.classList.remove('show');
          input.dispatchEvent(new Event('input'));
        });
      });
    }

    input.addEventListener('focus', function() {
      const val = this.value.trim().toLowerCase();
      if (val) {
        const filtered = options.filter(o => o.display.toLowerCase().includes(val));
        renderDropdown(filtered);
      } else {
        renderDropdown(options.slice(0, 10));
      }
    });

    input.addEventListener('input', function() {
      const val = this.value.trim().toLowerCase();
      if (!val) {
        dropdown.classList.remove('show');
        return;
      }
      const filtered = options.filter(o => o.display.toLowerCase().includes(val));
      renderDropdown(filtered);
    });

    input.addEventListener('blur', function() {
      setTimeout(() => dropdown.classList.remove('show'), 200);
    });

    document.addEventListener('click', function(e) {
      if (!wrapper.contains(e.target)) dropdown.classList.remove('show');
    });

    return input;
  }

  function performRelationQuery(pA, pB, maxDepth) {
    const container = document.getElementById('relationResultContainer');
    if (!maxDepth) maxDepth = 5;
    const results = findCommonAncestors(pA, pB, maxDepth);

    const pA_display = getDisplayName(pA);
    const pB_display = getDisplayName(pB);

    if (results.length === 0) {
      container.innerHTML = `
        <div class="relation-result">
          <div class="no-result">🐼${pA_display} 与 🐼${pB_display} 没有找到 ${maxDepth >= 999 ? '所有已知代数' : maxDepth + ' 代以内'} 的共同祖先</div>
        </div>
      `;
      return;
    }

    let html = `<div class="relation-result">`;

    html += `<div class="result-headline">🐼${pA_display} 与 🐼${pB_display} 的亲缘关系是：</div>`;

    results.forEach((r, idx) => {
      const ancestor = getPandaById(r.ancestorId);
      const ancestorDisplay = ancestor ? getDisplayName(ancestor) : r.ancestorName;
      const ancestorGender = r.ancestorGender || '未知';
      const genderIcon = ancestorGender === '雌性' ? '♀' : (ancestorGender === '雄性' ? '♂' : '');

      // 反转路径显示顺序：从共同祖先 → 待查熊猫
      const reversedPathA = [...r.pathA].reverse();
      const reversedPathB = [...r.pathB].reverse();

      const pathA_str = reversedPathA.map(p => `${p.name}${p.gender === '雌性' ? '♀' : (p.gender === '雄性' ? '♂' : '')}`).join('-');
      const pathB_str = reversedPathB.map(p => `${p.name}${p.gender === '雌性' ? '♀' : (p.gender === '雄性' ? '♂' : '')}`).join('-');

      html += `
        <div class="ancestor-group">
          <div class="ancestor-title">
            ${idx+1}、 ${ancestorDisplay} ${genderIcon}
          </div>
          <div class="path-item" data-path='${JSON.stringify(reversedPathA)}'>
            ${pathA_str}
          </div>
          <div class="path-item" data-path='${JSON.stringify(reversedPathB)}'>
            ${pathB_str}
          </div>
        </div>
      `;
    });

    const copyText = generateCopyText(pA, pB, results);
    html += `
      <div class="copy-area">
        <button class="btn btn-success" id="relationCopyBtn"><i class="fas fa-copy"></i> 一键复制</button>
      </div>
    `;

    container.innerHTML = html;

    container.querySelectorAll('.path-item').forEach(el => {
      el.addEventListener('click', function() {
        try {
          const pathData = JSON.parse(this.dataset.path);
          if (pathData && pathData.length > 0) {
            // 反转后，pathData[0] 是共同祖先，需要跳转到路径中第一个非 A 非 B 的熊猫
            for (let p of pathData) {
              if (p.id !== pA.id && p.id !== pB.id) {
                const target = getPandaById(p.id);
                if (target) {
                  openDetail(target.id);
                  return;
                }
              }
            }
            const last = pathData[pathData.length - 1];
            if (last) {
              const target = getPandaById(last.id);
              if (target) openDetail(target.id);
            }
          }
        } catch (e) {}
      });
    });

    document.getElementById('relationCopyBtn').addEventListener('click', function() {
      navigator.clipboard.writeText(copyText).then(() => {
        alert('已复制到剪贴板！');
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = copyText;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('已复制到剪贴板！');
      });
    });
  }

  function exportJSON() {

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);

  function exportCSV() {
    const headers = ['id', 'name', 'alias', 'gender', 'birthday', 'org', 'location', 'mother', 'father', 'motherId', 'fatherId', 'pedigree', 'passingDate', 'isComplete', 'hasSeen', 'photo'];
    let csv = headers.join(',') + '\n';
    pandas.forEach(p => {
      const row = headers.map(h => {
        let val = p[h] !== undefined ? p[h] : '';
        if (typeof val === 'string') {
          if (val.includes(',') || val.includes('"') || val.includes('\n')) {
            val = '"' + val.replace(/"/g, '""') + '"';
          }
        } else if (typeof val === 'boolean') {
          val = val ? 'true' : 'false';
        }
        return val;
      });
      csv += row.join(',') + '\n';
    });
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pandas_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported) || !imported.length || !imported[0].name) {
          alert('数据格式无效，请检查JSON文件');
          return;
        }
        imported.forEach(p => {
          migrateAlias(p);
          if (p.isComplete === undefined) p.isComplete = false;
          if (p.motherId === undefined) p.motherId = '';
          if (p.fatherId === undefined) p.fatherId = '';
          if (p.lifeEvents === undefined) p.lifeEvents = [];
          if (p.hasSeen === undefined) p.hasSeen = false;
          if (p.photo === undefined) p.photo = '';
        });

        const overwrite = confirm('将导入 ' + imported.length + ' 条数据，是否覆盖当前所有数据？\n点击"确定"覆盖，"取消"则追加合并。');
        if (overwrite) {
          pandas = imported;
        } else {
          const existing = new Set(pandas.map(p => p.name));
          let added = 0;
          imported.forEach(p => {
            if (!existing.has(p.name)) {
              pandas.push(p);
              existing.add(p.name);
              added++;
            }
          });
          if (added === 0) { alert('所有数据已存在，没有新增'); return; }
        }
        const ids = pandas.map(p => { const n = parseInt(String(p.id).replace('p','')); return isNaN(n)?0:n; });
        nextId = (ids.length ? Math.max(...ids) : 0) + 1;
        saveData();
        alert('导入成功！当前共 ' + pandas.length + ' 条数据');
        searchInput.value = '';
        detailHistory = [];
        collapseState = {};
        renderBrowse();
      } catch(err) {
        alert('解析失败: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  importInput.addEventListener('change', function(e) {
    if (e.target.files.length) { importData(e.target.files[0]); e.target.value = ''; }
  });

  function createSuggestInputWithWildcard(containerId, options, inputId, initialValue, placeholder) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const wrapper = document.createElement('div');
    wrapper.className = 'custom-suggest';
    wrapper.innerHTML = `
      <input type="text" id="${inputId}" value="${initialValue || ''}" placeholder="${placeholder || '输入或选择'}" autocomplete="off" />
      <div class="suggest-dropdown" id="${inputId}_dropdown"></div>
    `;
